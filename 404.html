<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada | ProbLab</title>
    <meta name="robots" content="noindex">
    <script>
    (function () {
        var path = window.location.pathname;
        // Detect GitHub Pages base (e.g. /simprobscom)
        var base = window.location.hostname.endsWith('.github.io')
            ? '/' + path.split('/')[1]
            : '';
        // If the missing URL is under /en/, redirect to English homepage
        if (path.indexOf('/en/') !== -1) {
            window.location.replace(base + '/en/index.html');
        } else {
            window.location.replace(base + '/');
        }
    })();
    </script>
</head>
<body></body>
</html>
